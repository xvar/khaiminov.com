name: Blog comment cleanup

# giscus comments live as GitHub Discussions, keyed by page pathname
# (see apps/blog/src/components/Giscus.astro). They don't disappear on
# their own when a post's markdown file is removed, so when a push
# deletes a post, delete its matching discussion too.
#
# A post is one file per language (apps/blog/src/content/blog/<locale>/
# <slug>.md) and all of its translations share one discussion, so the
# discussion only goes once the slug is gone in every language - removing
# a single translation (or moving a file between folders) keeps it.
on:
  push:
    branches: ["**"]
    paths:
      - "apps/blog/src/content/blog/**"

permissions:
  contents: read
  discussions: write

jobs:
  delete-orphaned-discussions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: List removed posts
        id: removed
        run: |
          # Slugs that lost a file in this push and have none left in any
          # language (the pathspec's * also matches the <locale>/ folder).
          files=$(git diff --diff-filter=D --no-renames --name-only HEAD^ HEAD -- 'apps/blog/src/content/blog/*.md' | while read -r file; do
                slug=$(basename "$file" .md)
                if ! ls apps/blog/src/content/blog/*/"$slug".md apps/blog/src/content/blog/"$slug".md >/dev/null 2>&1; then
                  echo "$slug"
                fi
              done | sort -u || true)
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Delete matching giscus discussions
        if: steps.removed.outputs.files != ''
        uses: actions/github-script@v7
        with:
          script: |
            const repoOwner = "xvar";
            const repoName = "khaiminov.com";
            const files = `${{ steps.removed.outputs.files }}`.split("\n").filter(Boolean);

            for (const slug of files) {
              // The discussion title is the giscus term set in
              // apps/blog/src/components/Giscus.astro: "posts/<slug>/" with
              // no leading slash and no language prefix - this must match
              // that exactly or the search below silently finds nothing.
              const pathname = `posts/${slug}/`;

              const search = await github.graphql(
                `query($q: String!) {
                  search(query: $q, type: DISCUSSION, first: 10) {
                    nodes { ... on Discussion { id title } }
                  }
                }`,
                { q: `repo:${repoOwner}/${repoName} in:title "${pathname}"` }
              );

              const match = search.search.nodes.find((n) => n.title === pathname);
              if (!match) {
                console.log(`No giscus discussion found for ${pathname}, nothing to clean up.`);
                continue;
              }

              await github.graphql(
                `mutation($id: ID!) {
                  deleteDiscussion(input: { id: $id }) { discussion { id } }
                }`,
                { id: match.id }
              );
              console.log(`Deleted discussion for ${pathname} (id ${match.id}).`);
            }
