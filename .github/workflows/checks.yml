name: Checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  content-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JS syntax check
        run: |
          node --check apps/site/data.js
          node --check apps/site/app.js
      - name: Content check (asset paths + translation completeness)
        run: node scripts/check-content.mjs
