backend:
  name: github
  repo: xvar/khaiminov.com
  branch: feature/blog # TODO: switch to main once this branch is merged
  # GitHub backend needs an OAuth client to authenticate — this repo isn't on
  # Netlify, so that has to be either:
  #   - Decap Turbo (hosted OAuth + proxy, no infra to run: https://decapcms.org/docs/external-oauth-clients/)
  #   - a self-hosted OAuth provider (e.g. a small Cloudflare Worker)
  # Once you pick one, set base_url (and auth_endpoint if needed) here.
  base_url: "" # TODO

media_folder: "apps/blog/public/images/blog"
public_folder: "/images/blog"

collections:
  - name: "blog"
    label: "Блог"
    label_singular: "Статья"
    folder: "apps/blog/src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "Дата", name: "date", widget: "datetime" }
      - { label: "Описание", name: "description", widget: "text" }
      - { label: "Текст", name: "body", widget: "markdown" }
